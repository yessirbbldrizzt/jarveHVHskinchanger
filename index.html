<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CS2 Custom Agent Selector</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <style>
    :root {
      /* Icy blue / dark theme */
      --primary: #8cb6ff; 
      --primary-hover: #abc9ff;
      --bg: #12141a;
      --card-bg: #1b1e28;
      --card-border: #2c3245;
      --text: #e0e6f8;
      --text-muted: #7483a9;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(140, 182, 255, 0.1) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(100, 120, 200, 0.08) 0px, transparent 50%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 50px 20px 80px 20px;
    }

    header { text-align: center; margin-bottom: 40px; }
    
    h1 {
      font-size: 2.4rem;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: -0.5px;
      margin-bottom: 10px;
      text-shadow: 0 0 20px rgba(140, 182, 255, 0.2);
    }

    p { color: var(--text-muted); max-width: 500px; line-height: 1.5; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 1100px;
      margin-bottom: 40px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 12px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: all 0.2s ease;
      user-select: none;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: #4a5a80;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.6);
    }

    .card.selected {
      border-color: var(--primary);
      background: #171d2b;
      box-shadow: 0 0 0 1px var(--primary), 0 10px 25px -5px rgba(140, 182, 255, 0.15);
    }

    .card input[type="checkbox"] {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 20px;
      height: 20px;
      accent-color: var(--primary);
      cursor: pointer;
      z-index: 2;
    }

    .img-container {
      width: 100%;
      height: 160px;
      border-radius: 10px;
      background: #0d0f14;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }

    .img-container img {
      width: 100%;
      height: 100%;
      /* CONTAIN forces the full image to show and center without chopping off heads */
      object-fit: contain; 
      object-position: center;
      transition: transform 0.3s ease;
    }

    .card:hover .img-container img { transform: scale(1.08); }

    .info { display: flex; flex-direction: column; gap: 3px; padding-top: 4px; }
    .title { font-weight: 700; font-size: 1rem; color: #fff; }
    
    .category {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--primary);
    }

    .download-container { position: sticky; bottom: 24px; z-index: 10; }

    button {
      background: var(--primary);
      color: #0b0d14;
      font-weight: 800;
      font-size: 1rem;
      border: none;
      padding: 16px 40px;
      border-radius: 50px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 10px 30px rgba(140, 182, 255, 0.25);
      transition: all 0.2s ease;
    }

    button:hover {
      background: var(--primary-hover);
      transform: scale(1.03);
      box-shadow: 0 12px 35px rgba(140, 182, 255, 0.4);
    }

    button:active { transform: scale(0.97); }
  </style>
</head>
<body>

  <header>
    <h1>CS2 Custom Agent Selector</h1>
    <p>Select only the character models you want. Keeps match loading fast and avoids folder bloat.</p>
  </header>

  <!-- The grid is automatically filled by the JavaScript below -->
  <div class="grid" id="agentGrid"></div>

  <div class="download-container">
    <button onclick="downloadPack()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
      Download Custom Pack (.zip)
    </button>
  </div>

  <script>
    const AGENTS_DATA = [
      {
        id: "steve",
        name: "Steve",
        category: "Minecraft",
        image: "https://www.exitlag.com/blog/wp-content/uploads/2024/12/steve-from-minecraft-2.webp", 
        path: "agents\\models\\hmn_ag2\\minecraft\\steve\\steve.vmdl"
      },
      {
        id: "peely",
        name: "Peely",
        category: "Fortnite",
        image: "https://wallpaperaccess.com/full/3839744.jpg", 
        path: "agents\\models\\hmn_ag2\\fortnite\\peely\\peely.vmdl"
      },
      {
        id: "homelander",
        name: "Homelander",
        category: "The Boys",
        image: "https://assets.altarofgaming.com/wp-content/uploads/2024/07/homelander-mortal-kombat-1-character-artwork-altar-of-gaming-1349-726x1024.png",
        path: "agents\\models\\hmn_ag2\\the_boys\\homelander\\homelander.vmdl"
      },
      {
        id: "yoshi",
        name: "Yoshi",
        category: "Mario Series",
        image: "https://static.wikia.nocookie.net/vsbattles/images/1/1c/Yoshi_Ultimate.png/revision/latest/scale-to-width-down/260?cb=20180612233650",
        path: "agents\\models\\hmn_ag2\\mario_series\\yoshi\\yoshi.vmdl"
      },
      {
        id: "async_hazmat",
        name: "Async Hazmat",
        category: "Backrooms",
        image: "https://images.cults3d.com/DjD0LdzCSTZZIsWdz4IhiF5H7z4=/516x516/filters:no_upscale():format(webp)/https://fbi.cults3d.com/uploaders/30212331/illustration-file/1c97739b-75f0-4ea6-98ef-94ebff678124/br3.png",
        path: "agents\\models\\hmn_ag2\\backrooms\\async_hazmat_suits\\async_hazmat_suits.vmdl"
      },
      {
        id: "simon",
        name: "Simon Henriksson",
        category: "Cry of Fear",
        image: "https://static.wikia.nocookie.net/p__/images/b/b3/SimonHenriksson.png/revision/latest?cb=20231108143238&path-prefix=protagonist",
        path: "agents\\models\\hmn_ag2\\cry_of_fear\\simon_henriksson\\simon_henriksson.vmdl"
      },
      {
        id: "springtrap",
        name: "Springtrap",
        category: "Zombies / FNAF",
        image: "https://preview.redd.it/if-they-ever-make-a-fnaf-movie-3-what-will-they-do-with-v0-e3fld4gnc9zf1.png?auto=webp&s=021197677753e5b9b0d9540b94de187c0b1b3943",
        path: "agents\\models\\hmn_ag2\\zombie\\springtrap\\springtrap.vmdl"
      },
      {
        id: "xenomorph",
        name: "Xenomorph",
        category: "Zombies / Alien",
        image: "https://static.wikia.nocookie.net/aliens/images/d/d3/Xenomorph-design.jpg/revision/latest?cb=20200302150206",
        path: "agents\\models\\hmn_ag2\\zombie\\xenomorph\\xenomorph.vmdl"
      },
      {
        id: "witch_headcrab",
        name: "Witch Headcrab",
        category: "Zombies / L4D",
        image: "https://images.steamusercontent.com/ugc/2486623401413535357/72DCBE5686E51C74591FA5E75E557E32219BFE0B/?imw=268&imh=268&ima=fit&impolicy=Letterbox&imcolor=%23000000&letterbox=true",
        path: "agents\\models\\hmn_ag2\\zombie\\witch_headcrab\\witch_headcrab.vmdl"
      },
      {
        id: "skeleton",
        name: "Skeleton",
        category: "Zombies",
        image: "https://as2.ftcdn.net/v2/jpg/00/67/91/25/1000_F_67912559_EtGFNC9vHL3dLpwbEB4FQMbZ3k58uy9z.jpg",
        path: "agents\\models\\hmn_ag2\\zombie\\skeleton\\skeleton.vmdl"
      }
    ];

    // Automatically generates the HTML cards based on the data above
    const grid = document.getElementById("agentGrid");

    AGENTS_DATA.forEach(agent => {
      const card = document.createElement("div");
      card.className = "card";
      card.onclick = () => toggleCard(card);
      
      card.innerHTML = `
        <input type="checkbox" value="${agent.id}" class="agent-check" onclick="event.stopPropagation(); updateCard(this);">
        <div class="img-container">
          <img src="${agent.image}" referrerpolicy="no-referrer" alt="${agent.name}" onerror="this.src='https://placehold.co/200x160/1b1e28/7483a9?text=Image+Missing'">
        </div>
        <div class="info">
          <span class="category">${agent.category}</span>
          <span class="title">${agent.name}</span>
        </div>
      `;
      grid.appendChild(card);
    });

    function toggleCard(cardElement) {
      const checkbox = cardElement.querySelector('.agent-check');
      checkbox.checked = !checkbox.checked;
      cardElement.classList.toggle('selected', checkbox.checked);
    }

    function updateCard(checkboxElement) {
      const card = checkboxElement.closest('.card');
      card.classList.toggle('selected', checkboxElement.checked);
    }

    function downloadPack() {
      const zip = new JSZip();
      const selected = document.querySelectorAll('.agent-check:checked');

      if (selected.length === 0) {
        alert("Please select at least one agent!");
        return;
      }

      let configText = "=== MEMESENSE CUSTOM AGENT PATHS ===\n";
      configText += "Copy and paste these exact paths into the Customizations box in MemeSense:\n\n";

      selected.forEach(box => {
        const agent = AGENTS_DATA.find(a => a.id === box.value);
        if (agent) {
          configText += agent.path + "\n";
        }
      });

      zip.file("MEMESENSE_CUSTOM_PATHS.txt", configText);

      zip.generateAsync({ type: "blob" }).then(function(content) {
        saveAs(content, "CS2_Custom_Agent_Pack.zip");
      });
    }
  </script>
</body>
</html>
